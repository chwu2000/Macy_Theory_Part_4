<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玫羲理论 (Macy Theory)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #ffffff; margin-bottom: 5px; letter-spacing: 1px; }
        p { margin-top: 0; color: #a0a0a0; margin-bottom: 20px; font-size: 15px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; background: #1e1e1e; padding: 20px;
            border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 1400px; width: 100%;
        }
        .controls { flex: 1; min-width: 320px; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        .control-group { background: #2a2a2a; padding: 12px 15px; border: 1px solid #333; border-radius: 8px; }
        .coupled-group { background: #351e1e; border: 1px solid #e74c3c; box-shadow: inset 0 0 10px rgba(231,76,60,0.1); }
        label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: #4da8da; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #4da8da; }
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 8px; background-color: #4da8da; color: #000; border: none;
            border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #3b8bb8; }
        button.stop { background-color: #e74c3c; color: #fff; }
        button.stop:hover { background-color: #c0392b; }
        
        .info-panel { margin-top: auto; padding: 15px; background: #1a252f; border-left: 5px solid #2ecc71; border-radius: 5px; font-family: 'Courier New', Courier, monospace; font-size: 13.5px; line-height: 1.5; color: #ecf0f1; }
        
        /* 視覺化四格網格 */
        .visual-panel { flex: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; min-width: 600px; }
        .visualization { display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; background: #000000; border: 1px solid #333; border-radius: 8px; padding: 10px; position: relative; overflow: hidden;
        }
        .vis-title { color: #f1c40f; font-weight: bold; margin-bottom: 10px; font-size: 15px; text-align: center; background: rgba(241,196,15,0.1); padding: 5px 15px; border-radius: 5px;}
        .vis-subtitle { color: #aaa; font-size: 12px; margin-top: -5px; margin-bottom: 10px; text-align: center; }
        
        .color-legend { width: 100%; height: 10px; border-radius: 5px; margin-top: 6px;
            background: linear-gradient(to right, hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%), hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
        }
        svg { width: 100%; height: auto; max-height: 400px; }
        .three-container { width: 100%; height: 400px; }
        
        .link-icon { text-align: center; color: #e74c3c; font-size: 20px; margin: -5px 0; font-weight: bold; }
    </style>
</head>
<body>

    <h1>玫羲理论 (Macy Theory) </h1>
    <p>微观世界的真实本质：洛伦兹推进与空间旋转的完整映射</p>

    <div class="container">
        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group" style="border-left: 4px solid #f39c12;">
                <label style="color: #f39c12;"><span>◆ 玫羲理论动态展示 </span></label>
                <div class="btn-group">
                    <button id="playBtn">开始 (Play)</button>
                    <button id="pauseBtn" class="stop">暂停 (Pause)</button>
                </div>
                <label style="margin-top: 10px;">
                    <span style="color: #ecf0f1;">角速度 (ω)</span>
                    <span id="omegaVal" style="color: #fff;">1.00 x</span>
                </label>
                <input type="range" id="omega" min="0.1" max="3" step="0.1" value="1">
                
                <label style="margin-top: 5px;">
                    <span style="color: #ecf0f1;">初始相位差 α = 2(π/2 + φ_tilt)</span>
                    <span id="alphaVal" style="color: #fff;">180°</span>
                </label>
                <input type="range" id="alpha" min="0" max="360" value="180">
                <div class="color-legend"></div>
            </div>

            <div class="control-group" style="border-left: 4px solid #2ecc71;">
                <label style="color: #2ecc71;">
                    <span>◆ 椭圆运动分解为大小圆周运动</span>
                </label>
                <label style="display: flex; align-items: center; justify-content: flex-start; gap: 10px; cursor: pointer; margin-top: 10px;">
                    <input type="checkbox" id="toggleDecomp" style="width: 18px; height: 18px; accent-color: #2ecc71;" checked>
                    <span style="color: #fff; font-weight: bold; font-size: 14px;">开启 大园/小园 分解</span>
                </label>
            </div>

            <div class="control-group coupled-group">
                <div style="text-align: center; color: #e74c3c; font-weight: bold; margin-bottom: 5px;">▼ 洛伦兹推进 (M_boost) ▼</div>
                <label style="color: #e74c3c;">
                    <span>快度 (η)</span>
                    <span id="etaVal" style="color: #fff;">1.00</span>
                </label>
                <input type="range" id="eta" min="-3" max="3" step="0.01" value="1" style="accent-color: #e74c3c;">
                
                <div class="link-icon">⇅</div>

                <label style="color: #e74c3c;">
                    <span>初始极角 (θ_macy, obs)</span>
                    <span id="thetaObsVal" style="color: #fff;">0.0°</span>
                </label>
                <input type="range" id="theta_obs" min="0.00" max="179.99" step="0.1" value="0" style="accent-color: #e74c3c;">
            </div>

            <!-- 空間旋轉變換 M_rotate 控制 -->
            <div class="control-group" style="border-left: 4px solid #3498db;">
                <div style="text-align: center; color: #3498db; font-weight: bold; margin-bottom: 5px;">▼ 空间旋转 (M_rotate) ▼</div>
                <label style="color: #3498db;">
                    <span style="color: #ecf0f1;">旋转角 (θ_R)</span>
                    <span id="thetaRVal" style="color: #fff;">0°</span>
                </label>
                <input type="range" id="theta_R" min="0" max="360" value="0" step="1" style="accent-color: #3498db;">

                <label style="margin-top: 10px; color: #3498db;">
                    <span style="color: #ecf0f1;">旋转轴方位 (φ_R)</span>
                    <span id="phiRVal" style="color: #fff;">0°</span>
                </label>
                <input type="range" id="phi_R" min="0" max="360" value="0" step="1" style="accent-color: #3498db;">
            </div>

            <div class="info-panel" id="infoPanel"></div>
        </div>

        <!-- 視覺化面板 (2x2 Grid) -->
        <div class="visual-panel">
            <!-- 1. 原始橢圓 -->
            <div class="visualization">
                <div class="vis-title">【短軸平行相對速度的玫羲橢圓】</div>
                <div class="vis-subtitle">未施加空间旋转 (M_boost 作用后)</div>
                <svg id="svgCanvas1" viewBox="-300 -300 600 600">
                    <defs>
                        <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                        <marker id="arrowhead1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fff" /></marker>
                        <marker id="arrowRed1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff4c4c" /></marker>
                        <marker id="arrowBlue1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3498db" /></marker>
                        <marker id="axisArrow1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#888" /></marker>
                    </defs>
                    <line x1="-280" y1="0" x2="280" y2="0" stroke="#555" stroke-width="1.5" marker-end="url(#axisArrow1)"/>
                    <line x1="0" y1="280" x2="0" y2="-280" stroke="#888" stroke-width="2.5" marker-end="url(#axisArrow1)"/>
                    <text x="220" y="-10" font-family="sans-serif" font-size="14" fill="#888">X 轴</text>
                    <text x="10" y="-260" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ecf0f1">Z 轴 (v_DA)</text>

                    <g id="decompositionGroup1">
                        <circle id="largeCirclePath1" cx="0" cy="0" r="0" fill="none" stroke="#ff4c4c" stroke-width="1.5" stroke-dasharray="4,4" opacity="1"/>
                        <circle id="smallCirclePath1" cx="0" cy="0" r="0" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,4" opacity="1"/>
                        <path id="parallelogram1" d="" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>
                        <line id="vecLarge1" x1="0" y1="0" x2="0" y2="0" stroke="#ff4c4c" stroke-width="2.5" marker-end="url(#arrowRed1)"/>
                        <line id="vecSmall1" x1="0" y1="0" x2="0" y2="0" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue1)"/>
                    </g>
                    <g id="ellipseGroup1">
                        <ellipse id="boostedEllipse1" cx="0" cy="0" rx="100" ry="100" fill="none" stroke="#e74c3c" stroke-width="2.5" opacity="0.9" />
                        <line id="majorAxis1" x1="0" y1="-141.4" x2="0" y2="141.4" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
                    </g>
                    <line id="vectorLine1" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3" marker-end="url(#arrowhead1)" />
                    <circle id="vectorPoint1" cx="0" cy="0" r="5" fill="#fff" filter="url(#glow1)"/>
                </svg>
            </div>
            
            <!-- 2. 原始玫羲球 -->
            <div class="visualization">
                <div class="vis-title">【短軸平行相對速度的玫羲球】</div>
                <div class="vis-subtitle">对应量子力学的布洛赫球基态</div>
                <div id="threeCanvas1" class="three-container"></div>
            </div>

            <!-- 3. 旋轉後橢圓 -->
            <div class="visualization">
                <div class="vis-title">【玫羲橢圓】</div>
                <div class="vis-subtitle" style="color: #3498db;">施加空间旋转 M_rotate (大小圆分量发生混合)</div>
                <svg id="svgCanvas2" viewBox="-300 -300 600 600">
                    <defs>
                        <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                        <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fff" /></marker>
                        <marker id="arrowRed2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff4c4c" /></marker>
                        <marker id="arrowBlue2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3498db" /></marker>
                        <marker id="axisArrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#888" /></marker>
                    </defs>
                    <line x1="-280" y1="0" x2="280" y2="0" stroke="#555" stroke-width="1.5" marker-end="url(#axisArrow2)"/>
                    <line x1="0" y1="280" x2="0" y2="-280" stroke="#888" stroke-width="2.5" marker-end="url(#axisArrow2)"/>
                    <text x="220" y="-10" font-family="sans-serif" font-size="14" fill="#888">X 轴</text>
                    <text x="10" y="-260" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ecf0f1">Z 轴</text>

                    <g id="decompositionGroup2">
                        <!-- 旋轉後投影為橢圓的大小圓軌跡 -->
                        <path id="rotatedLargePath" d="" fill="none" stroke="#ff4c4c" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
                        <path id="rotatedSmallPath" d="" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
                        
                        <path id="parallelogram2" d="" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>
                        <line id="vecLarge2" x1="0" y1="0" x2="0" y2="0" stroke="#ff4c4c" stroke-width="2.5" marker-end="url(#arrowRed2)"/>
                        <line id="vecSmall2" x1="0" y1="0" x2="0" y2="0" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue2)"/>
                    </g>
                    <!-- 軌跡用 path 繪製 -->
                    <path id="trajectoryPath2" d="" fill="none" stroke="#3498db" stroke-width="2.5" opacity="0.9" />
                    <line id="vectorLine2" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3" marker-end="url(#arrowhead2)" />
                    <circle id="vectorPoint2" cx="0" cy="0" r="5" fill="#fff" filter="url(#glow2)"/>
                </svg>
            </div>

            <!-- 4. 旋轉後玫羲球 -->
            <div class="visualization">
                <div class="vis-title">【玫羲球】</div>
                <div class="vis-subtitle" style="color: #3498db;">对应量子力学布洛赫球 任意方向的自旋叠加态</div>
                <div id="threeCanvas2" class="three-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        // ========== 初始化 Three.js 視窗 1 ==========
        const container1 = document.getElementById('threeCanvas1');
        const scene1 = new THREE.Scene();
        const camera1 = new THREE.PerspectiveCamera(45, container1.clientWidth / container1.clientHeight, 0.1, 1000);
        camera1.position.set(2.5, 1.5, 3.5);
        const renderer1 = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer1.setSize(container1.clientWidth, container1.clientHeight);
        renderer1.setPixelRatio(window.devicePixelRatio);
        container1.appendChild(renderer1.domElement);
        const controls1 = new OrbitControls(camera1, renderer1.domElement);
        controls1.enableDamping = true;

        // ========== 初始化 Three.js 視窗 2 ==========
        const container2 = document.getElementById('threeCanvas2');
        const scene2 = new THREE.Scene();
        const camera2 = new THREE.PerspectiveCamera(45, container2.clientWidth / container2.clientHeight, 0.1, 1000);
        camera2.position.set(2.5, 1.5, 3.5);
        const renderer2 = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer2.setSize(container2.clientWidth, container2.clientHeight);
        renderer2.setPixelRatio(window.devicePixelRatio);
        container2.appendChild(renderer2.domElement);
        const controls2 = new OrbitControls(camera2, renderer2.domElement);
        controls2.enableDamping = true;

        // 建立球體模型輔助函式
        function createBlochSphere(scene) {
            const sphereGeo = new THREE.SphereGeometry(1, 32, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x4da8da, wireframe: true, transparent: true, opacity: 0.15 });
            scene.add(new THREE.Mesh(sphereGeo, sphereMat));

            const edges = new THREE.EdgesGeometry(new THREE.SphereGeometry(1, 16, 8));
            const lineMat = new THREE.LineBasicMaterial({ color: 0x4da8da, transparent: true, opacity: 0.3 });
            scene.add(new THREE.LineSegments(edges, lineMat));

            const createAxis = (color, endPt) => {
                const mat = new THREE.LineBasicMaterial({ color: color });
                const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), endPt]);
                return new THREE.Line(geo, mat);
            };
            scene.add(createAxis(0xaaaaaa, new THREE.Vector3(1.2, 0, 0))); // X
            scene.add(createAxis(0xaaaaaa, new THREE.Vector3(0, 0, 1.2))); // Y (物理空间)
            scene.add(createAxis(0xeeeeee, new THREE.Vector3(0, 1.2, 0))); // Z (物理空间/北极)

            const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 1.0, 0xffffff, 0.15, 0.1);
            scene.add(arrow);
            return arrow;
        }

        const blochArrow1 = createBlochSphere(scene1);
        const blochArrow2 = createBlochSphere(scene2);

        // ========== UI 控制邏輯 ==========
        const R = 100; // 顯示縮放基準
        let animationId;
        let isPlaying = false;
        let systemTime = 0; 

        const inputEta = document.getElementById('eta');
        const inputThetaObs = document.getElementById('theta_obs');
        const inputThetaR = document.getElementById('theta_R');
        const inputPhiR = document.getElementById('phi_R');
        const toggleDecomp = document.getElementById('toggleDecomp');

        // Wigner Rotation Equivalent (用於快度與觀察極角的連動)
        function updateFromEta() {
            let eta = parseFloat(inputEta.value);
            let tanh_eta = Math.tanh(eta / 2);
            let tan_obs = tanh_eta; // 假設起始靜止極角為 0
            if(tan_obs < 0) tan_obs = 0; 
            inputThetaObs.value = (2 * Math.atan(tan_obs) * 180 / Math.PI).toFixed(2);
            if(!isPlaying) renderVisualization();
        }

        function updateFromThetaObs() {
            let th_obs = parseFloat(inputThetaObs.value) * Math.PI / 180;
            let tan_obs = Math.tan(th_obs / 2);
            let tanh_eta = tan_obs; // 假設起始靜止極角為 0
            tanh_eta = Math.max(-0.999, Math.min(0.999, tanh_eta));
            let eta = 2 * Math.atanh(tanh_eta);
            inputEta.value = Math.max(-3, Math.min(3, eta)).toFixed(2);
            if(!isPlaying) renderVisualization();
        }

        inputEta.addEventListener('input', updateFromEta);
        inputThetaObs.addEventListener('input', updateFromThetaObs);
        inputThetaR.addEventListener('input', () => {
            document.getElementById('thetaRVal').innerText = inputThetaR.value + '°';
            if(!isPlaying) renderVisualization();
        });
        inputPhiR.addEventListener('input', () => {
            document.getElementById('phiRVal').innerText = inputPhiR.value + '°';
            if(!isPlaying) renderVisualization();
        });

        // Toggle SVG Decomposition elements
        toggleDecomp.addEventListener('change', (e) => {
            const displayMode = e.target.checked ? 'inline' : 'none';
            document.getElementById('decompositionGroup1').setAttribute('display', displayMode);
            document.getElementById('decompositionGroup2').setAttribute('display', displayMode);
            if(!isPlaying) renderVisualization();
        });

        // === 產生 2D 軌跡點 (包含總軌跡與大小圓的投影軌跡) ===
        function generateTrajectories(r_large, r_small, alpha_rad, thR_rad, phiR_rad) {
            let ptsTotal = [], ptsLarge = [], ptsSmall = [];
            const cos_thR2 = Math.cos(thR_rad/2);
            const sin_thR2 = Math.sin(thR_rad/2);
            
            // 【修正】：精確的 -i * exp(±i*phi) 展開結果
            const m12_re = -Math.sin(phiR_rad) * sin_thR2;
            const m12_im = -Math.cos(phiR_rad) * sin_thR2;
            const m21_re =  Math.sin(phiR_rad) * sin_thR2;
            const m21_im = -Math.cos(phiR_rad) * sin_thR2;

            for(let i=0; i<=360; i+=5) {
                let t_rad = i * Math.PI / 180;
                let p1_re = r_large * Math.cos(t_rad);
                let p1_im = r_large * Math.sin(t_rad);
                let p2_re = r_small * Math.cos(-t_rad + alpha_rad);
                let p2_im = r_small * Math.sin(-t_rad + alpha_rad);

                // 僅大圓成分 (p2 = 0)
                let c1L_re = cos_thR2 * p1_re;
                let c1L_im = cos_thR2 * p1_im;
                let c2L_re = (m21_re * p1_re - m21_im * p1_im);
                let c2L_im = (m21_re * p1_im + m21_im * p1_re);
                ptsLarge.push(`${c1L_im + c2L_im},${-(c1L_re + c2L_re)}`);

                // 僅小圓成分 (p1 = 0)
                let c1S_re = (m12_re * p2_re - m12_im * p2_im);
                let c1S_im = (m12_re * p2_im + m12_im * p2_re);
                let c2S_re = cos_thR2 * p2_re;
                let c2S_im = cos_thR2 * p2_im;
                ptsSmall.push(`${c1S_im + c2S_im},${-(c1S_re + c2S_re)}`);

                // 疊加總軌跡
                ptsTotal.push(`${(c1L_im + c1S_im) + (c2L_im + c2S_im)},${-((c1L_re + c1S_re) + (c2L_re + c2S_re))}`);
            }
            return {
                total: `M ${ptsTotal.join(' L ')} Z`,
                large: `M ${ptsLarge.join(' L ')} Z`,
                small: `M ${ptsSmall.join(' L ')} Z`
            };
        }

        // --- 核心物理渲染 ---
        function renderVisualization() {
            const alpha = parseFloat(document.getElementById('alpha').value);
            const eta = parseFloat(inputEta.value);
            const th_obs = parseFloat(inputThetaObs.value);
            const omega = parseFloat(document.getElementById('omega').value);
            
            // 空間旋轉參數 M_rotate
            const thR = parseFloat(inputThetaR.value);
            const phiR = parseFloat(inputPhiR.value);
            const thR_rad = thR * Math.PI / 180;
            const phiR_rad = phiR * Math.PI / 180;

            // 1. 基本推進運算
            const a_boost = Math.exp(eta / 2);
            const b_boost = Math.exp(-eta / 2);
            const a_axis = R * a_boost; 
            const b_axis = R * b_boost; 
            const r_large = (a_axis + b_axis) / 2;
            const r_small = (a_axis - b_axis) / 2;
            
            const alpha_rad = alpha * Math.PI / 180;
            const tilt_deg = alpha / 2;
            
            // 方位角演化 (Macy 球全局)
            let phi_deg = alpha - 2 * systemTime;
            let color_phi = ((phi_deg % 360) + 360) % 360; 
            const t_rad = systemTime * Math.PI / 180;

            // ==========================================
            // 面板 1 & 2: 原始洛倫茲推進態 (短軸平行相對速度)
            // ==========================================
            const p1_re = r_large * Math.cos(t_rad);
            const p1_im = r_large * Math.sin(t_rad);
            const p2_re = r_small * Math.cos(-t_rad + alpha_rad);
            const p2_im = r_small * Math.sin(-t_rad + alpha_rad);
            
            const svg1_x = p1_im + p2_im;
            const svg1_y = -(p1_re + p2_re);

            // 更新 UI 1
            document.getElementById('etaVal').innerText = eta.toFixed(2);
            document.getElementById('thetaObsVal').innerText = th_obs.toFixed(1) + '°';
            document.getElementById('omegaVal').innerText = omega.toFixed(1) + ' x';
            document.getElementById('alphaVal').innerText = alpha + '°';
            
            const vectorColor = `hsl(${color_phi}, 100%, 55%)`;

            // SVG 1
            document.getElementById('boostedEllipse1').setAttribute('rx', Math.max(Math.abs(b_axis), 0.1));
            document.getElementById('boostedEllipse1').setAttribute('ry', Math.max(Math.abs(a_axis), 0.1));
            document.getElementById('ellipseGroup1').setAttribute('transform', `rotate(${tilt_deg})`);
            
            document.getElementById('vectorLine1').setAttribute('x2', svg1_x);
            document.getElementById('vectorLine1').setAttribute('y2', svg1_y);
            document.getElementById('vectorPoint1').setAttribute('cx', svg1_x);
            document.getElementById('vectorPoint1').setAttribute('cy', svg1_y);
            document.getElementById('vectorLine1').setAttribute('stroke', vectorColor);
            document.getElementById('vectorPoint1').setAttribute('fill', vectorColor);

            if (toggleDecomp.checked) {
                document.getElementById('largeCirclePath1').setAttribute('r', r_large);
                document.getElementById('smallCirclePath1').setAttribute('r', r_small);
                document.getElementById('vecLarge1').setAttribute('x2', p1_im);
                document.getElementById('vecLarge1').setAttribute('y2', -p1_re);
                document.getElementById('vecSmall1').setAttribute('x2', p2_im);
                document.getElementById('vecSmall1').setAttribute('y2', -p2_re);
                document.getElementById('parallelogram1').setAttribute('d', `M ${p1_im} ${-p1_re} L ${svg1_x} ${svg1_y} L ${p2_im} ${-p2_re}`);
            }

            // ThreeJS 1
            const radThetaObs = th_obs * Math.PI / 180;
            const radPhi = phi_deg * Math.PI / 180;
            const bx1 = Math.sin(radThetaObs) * Math.cos(radPhi);
            const bz1 = Math.sin(radThetaObs) * Math.sin(radPhi);
            const by1 = Math.cos(radThetaObs);
            blochArrow1.setDirection(new THREE.Vector3(bx1, by1, bz1).normalize());
            blochArrow1.setColor(new THREE.Color(vectorColor));


            // ==========================================
            // 面板 3 & 4: 空間旋轉後的狀態 (一般玫羲理論)
            // ==========================================
            const cos_thR2 = Math.cos(thR_rad/2);
            const sin_thR2 = Math.sin(thR_rad/2);
            
            // 【修正】：精確的 -i * exp(±i*phi) 展開結果
            const m12_re = -Math.sin(phiR_rad) * sin_thR2;
            const m12_im = -Math.cos(phiR_rad) * sin_thR2;
            const m21_re =  Math.sin(phiR_rad) * sin_thR2;
            const m21_im = -Math.cos(phiR_rad) * sin_thR2;

            // M_rotate 作用於向量分量
            const c1_re = cos_thR2 * p1_re + (m12_re * p2_re - m12_im * p2_im);
            const c1_im = cos_thR2 * p1_im + (m12_re * p2_im + m12_im * p2_re);
            const c2_re = (m21_re * p1_re - m21_im * p1_im) + cos_thR2 * p2_re;
            const c2_im = (m21_re * p1_im + m21_im * p1_re) + cos_thR2 * p2_im;

            const svg2_x = c1_im + c2_im;
            const svg2_y = -(c1_re + c2_re);

            const paths = generateTrajectories(r_large, r_small, alpha_rad, thR_rad, phiR_rad);

            // 更新軌跡 SVG 2
            document.getElementById('trajectoryPath2').setAttribute('d', paths.total);
            document.getElementById('vectorLine2').setAttribute('x2', svg2_x);
            document.getElementById('vectorLine2').setAttribute('y2', svg2_y);
            document.getElementById('vectorPoint2').setAttribute('cx', svg2_x);
            document.getElementById('vectorPoint2').setAttribute('cy', svg2_y);
            document.getElementById('vectorLine2').setAttribute('stroke', vectorColor);
            document.getElementById('vectorPoint2').setAttribute('fill', vectorColor);

            if (toggleDecomp.checked) {
                // 畫出旋轉後的大圓與小圓投影
                document.getElementById('rotatedLargePath').setAttribute('d', paths.large);
                document.getElementById('rotatedSmallPath').setAttribute('d', paths.small);

                document.getElementById('vecLarge2').setAttribute('x2', c1_im);
                document.getElementById('vecLarge2').setAttribute('y2', -c1_re);
                document.getElementById('vecSmall2').setAttribute('x2', c2_im);
                document.getElementById('vecSmall2').setAttribute('y2', -c2_re);
                document.getElementById('parallelogram2').setAttribute('d', `M ${c1_im} ${-c1_re} L ${svg2_x} ${svg2_y} L ${c2_im} ${-c2_re}`);
            }

            // ThreeJS 2 玫羲球)
            // 將 M_rotate 作用於旋量基礎態，計算布洛赫向量 (n_x, n_y, n_z)
            const cos_thmacy2 = Math.cos(radThetaObs / 2);
            const sin_thmacy2 = Math.sin(radThetaObs / 2);
            const s1_re = cos_thmacy2;
            const s1_im = 0;
            const s2_re = Math.cos(radPhi) * sin_thmacy2;
            const s2_im = Math.sin(radPhi) * sin_thmacy2;

            const s1_rot_re = cos_thR2 * s1_re + (m12_re * s2_re - m12_im * s2_im);
            const s1_rot_im = cos_thR2 * s1_im + (m12_re * s2_im + m12_im * s2_re);
            const s2_rot_re = (m21_re * s1_re - m21_im * s1_im) + cos_thR2 * s2_re;
            const s2_rot_im = (m21_re * s1_im + m21_im * s1_re) + cos_thR2 * s2_im;

            const norm2 = (s1_rot_re**2 + s1_rot_im**2) + (s2_rot_re**2 + s2_rot_im**2);
            const nx = 2 * (s1_rot_re * s2_rot_re + s1_rot_im * s2_rot_im) / norm2; // b_x
            const ny = 2 * (s1_rot_re * s2_rot_im - s1_rot_im * s2_rot_re) / norm2; // b_y (物理學上的 Y，ThreeJS上的 Z)
            const nz = ((s1_rot_re**2 + s1_rot_im**2) - (s2_rot_re**2 + s2_rot_im**2)) / norm2; // b_z (物理學上的 Z，ThreeJS上的 Y)

            blochArrow2.setDirection(new THREE.Vector3(nx, nz, ny).normalize());
            blochArrow2.setColor(new THREE.Color(vectorColor));

            // 更新渲染
            renderer1.render(scene1, camera1);
            renderer2.render(scene2, camera2);

            // 資訊面板更新
            document.getElementById('infoPanel').innerHTML = `
                <div style="color: #f1c40f; margin-bottom: 5px; font-weight: bold;">[ 基础状态 (M_boost) ]</div>
                初始极角 θ_macy = <strong>${th_obs.toFixed(1)}°</strong><br>
                方位角 φ_macy = <strong>${phi_deg.toFixed(1)}°</strong><br><br>
                <div style="color: #3498db; margin-bottom: 3px; font-weight: bold;">[ 空间旋转 (M_rotate) 后 ]</div>
                广义极角 θ = <strong>${(Math.acos(nz) * 180 / Math.PI).toFixed(1)}°</strong><br>
                <i style="color:#aaa; font-size:12px;">(展示大小圆分量发生混合干涉)</i>
            `;
        }

        // --- 動畫迴圈 ---
        function animate() {
            if (isPlaying) {
                systemTime += parseFloat(document.getElementById('omega').value);
                renderVisualization();
            }
            controls1.update(); 
            controls2.update();
            renderer1.render(scene1, camera1);
            renderer2.render(scene2, camera2);
            animationId = requestAnimationFrame(animate);
        }
        
        animate();

        // 綁定播放鈕
        document.getElementById('playBtn').addEventListener('click', () => { isPlaying = true; });
        document.getElementById('pauseBtn').addEventListener('click', () => { isPlaying = false; });
        document.getElementById('alpha').addEventListener('input', () => { if(!isPlaying) renderVisualization(); });
        document.getElementById('omega').addEventListener('input', () => { if(!isPlaying) renderVisualization(); });

        window.addEventListener('resize', () => {
            [ {cam: camera1, ren: renderer1, ctn: container1}, {cam: camera2, ren: renderer2, ctn: container2} ].forEach(c => {
                c.cam.aspect = c.ctn.clientWidth / c.ctn.clientHeight;
                c.cam.updateProjectionMatrix();
                c.ren.setSize(c.ctn.clientWidth, c.ctn.clientHeight);
            });
            renderVisualization();
        });

        // 啟動初始渲染
        updateFromEta();
    </script>
</body>
</html>
