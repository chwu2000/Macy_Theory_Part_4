<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玫羲理论</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #ffffff; margin-bottom: 5px; letter-spacing: 1px; }
        p { margin-top: 0; color: #a0a0a0; margin-bottom: 20px; font-size: 15px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; background: #1e1e1e; padding: 20px;
            border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 1400px; width: 100%;
        }
        .controls { flex: 1; min-width: 320px; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        .control-group { background: #2a2a2a; padding: 12px 15px; border: 1px solid #333; border-radius: 8px; }
        .coupled-group { background: #351e1e; border: 1px solid #e74c3c; box-shadow: inset 0 0 10px rgba(231,76,60,0.1); }
        label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: #4da8da; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #4da8da; }
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 8px; background-color: #4da8da; color: #000; border: none;
            border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #3b8bb8; }
        button.stop { background-color: #e74c3c; color: #fff; }
        button.stop:hover { background-color: #c0392b; }
        
        .info-panel { margin-top: auto; padding: 15px; background: #1a252f; border-left: 5px solid #2ecc71; border-radius: 5px; font-family: 'Courier New', Courier, monospace; font-size: 13.5px; line-height: 1.5; color: #ecf0f1; }
        
        /* 左右双视窗 */
        .visual-panel { flex: 2; display: flex; gap: 15px; min-width: 600px; flex-wrap: wrap; }
        .visualization { flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; background: #000000; border: 1px solid #333; border-radius: 8px; padding: 10px; position: relative; overflow: hidden;
        }
        .vis-title { color: #f1c40f; font-weight: bold; margin-bottom: 10px; font-size: 16px; text-align: center; background: rgba(241,196,15,0.1); padding: 5px 15px; border-radius: 5px;}
        
        .color-legend { width: 100%; height: 10px; border-radius: 5px; margin-top: 6px;
            background: linear-gradient(to right, hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%), hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
        }
        svg { width: 100%; height: auto; max-height: 500px; }
        #threeCanvas { width: 100%; height: 500px; }
        
        .highlight-rel { color: #e74c3c; font-weight: bold; }
        .link-icon { text-align: center; color: #e74c3c; font-size: 20px; margin: -5px 0; font-weight: bold; }
    </style>
</head>
<body>

    <h1>玫羲理论 (Macy Theory) </h1>
    <p>微观世界的真实本质：2D 玫羲椭圆 vs. 3D 玫羲球</p>
    <p>论文作者：吴志鸿 论文中的观察者(虚拟人物)：玫羲</p>

    <div class="container">
        <div class="controls">
            <div class="control-group" style="border-left: 4px solid #f39c12;">
                <label style="color: #f39c12;"><span>◆ 玫羲理论动态展示 </span></label>
                <div class="btn-group">
                    <button id="playBtn">开始 (Play)</button>
                    <button id="pauseBtn" class="stop">暂停 (Pause)</button>
                </div>
                <label style="margin-top: 10px;">
                    <span style="color: #ecf0f1;">角速度 (ω)</span>
                    <span id="omegaVal" style="color: #fff;">1.00 x</span>
                </label>
                <input type="range" id="omega" min="0.1" max="3" step="0.1" value="1">
                
                <label style="margin-top: 5px;">
                    <span style="color: #ecf0f1;">初始相位差 α = 2(π/2 + φ_tilt)</span>
                    <span id="alphaVal" style="color: #fff;">180°</span>
                </label>
                <input type="range" id="alpha" min="0" max="360" value="180">
                <div class="color-legend"></div>
            </div>

            <div class="control-group" style="border-left: 4px solid #2ecc71;">
                <label style="color: #2ecc71;">
                    <span>◆ 椭圆运动分解为大小圆周运动</span>
                </label>
                <label style="display: flex; align-items: center; justify-content: flex-start; gap: 10px; cursor: pointer; margin-top: 10px;">
                    <input type="checkbox" id="toggleDecomp" style="width: 18px; height: 18px; accent-color: #2ecc71;" checked>
                    <span style="color: #fff; font-weight: bold; font-size: 14px;">开启 大园/小园 分解</span>
                
            </div>

            <div class="control-group" style="border-left: 4px solid #9b59b6;">
                <label style="color: #9b59b6;">
                    <span>1. 初始极角 (θ_macy, orig)</span>
                    <span id="thetaOrigVal" style="color: #fff;">0.0°</span>
                </label>
                <input type="range" id="theta_orig" min="0.00" max="179.99" value="0" step="0.1">
            </div>

            <div class="control-group coupled-group">
                <div style="text-align: center; color: #e74c3c; font-weight: bold; margin-bottom: 5px;">▼ 改变快度&极角 相当于 改变相对速度 ▼</div>
                <label style="color: #e74c3c;">
                    <span>2. 快度 (η)</span>
                    <span id="etaVal" style="color: #fff;">1.00</span>
                </label>
                <input type="range" id="eta" min="-3" max="3" step="0.01" value="1" style="accent-color: #e74c3c;">
                
                <div class="link-icon">⇅</div>

                <label style="color: #e74c3c;">
                    <span>3. 极角 (θ_macy, obs)</span>
                    <span id="thetaObsVal" style="color: #fff;">0.0°</span>
                </label>
                <input type="range" id="theta_obs" min="0.00" max="179.99" step="0.1" value="0" style="accent-color: #e74c3c;">
            </div>

            <div class="info-panel" id="infoPanel"></div>
        </div>

        <div class="visual-panel">
            <div class="visualization">
                <div class="vis-title">【玫羲椭圆】</div>
                <svg id="svgCanvas" viewBox="-300 -300 600 600">
                    <defs>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                            <polygon points="0 0, 8 3, 0 6" fill="context-stroke" />
                        </marker>
                        <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                            <polygon points="0 0, 8 3, 0 6" fill="#ff4c4c" />
                        </marker>
                        <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                            <polygon points="0 0, 8 3, 0 6" fill="#3498db" />
                        </marker>
                        <marker id="axisArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#888" />
                        </marker>
                    </defs>
                    
                    <line x1="-280" y1="0" x2="280" y2="0" stroke="#555" stroke-width="1.5" marker-end="url(#axisArrow)"/>
                    <line x1="0" y1="280" x2="0" y2="-280" stroke="#888" stroke-width="2.5" marker-end="url(#axisArrow)"/>
                    
                    <text x="220" y="-10" font-family="sans-serif" font-size="14" fill="#888">X 轴</text>
                    <text x="10" y="-260" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ecf0f1">Z 轴 (相对运动方向 v_DA)</text>

                    <circle id="maxCircle" cx="0" cy="0" r="141.4" fill="none" stroke="rgba(155, 89, 182, 0.3)" stroke-width="2" stroke-dasharray="2,4" />
                    
                    <g id="decompositionGroup">
                        <circle id="largeCirclePath" cx="0" cy="0" r="0" fill="none" stroke="#ff4c4c" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
                        <circle id="smallCirclePath" cx="0" cy="0" r="0" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
                        <path id="parallelogram" d="" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>
                        <line id="vecLarge" x1="0" y1="0" x2="0" y2="0" stroke="#ff4c4c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
                        <line id="vecSmall" x1="0" y1="0" x2="0" y2="0" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
                        <circle id="dotLarge" cx="0" cy="0" r="5" fill="#ff4c4c" filter="url(#glow)"/>
                        <circle id="dotSmall" cx="0" cy="0" r="5" fill="#3498db" filter="url(#glow)"/>
                    </g>

                    <g id="ellipseGroup">
                        <ellipse id="boostedEllipse" cx="0" cy="0" rx="100" ry="100" fill="none" stroke="#e74c3c" stroke-width="2.5" opacity="0.9" />
                        <line id="majorAxis" x1="0" y1="-141.4" x2="0" y2="141.4" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
                    </g>

                    <line id="vectorLine" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3" marker-end="url(#arrowhead)" />
                    <circle id="vectorPoint" cx="0" cy="0" r="5" fill="#fff" filter="url(#glow)"/>
                    <text id="labelE" x="0" y="0" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff" filter="url(#glow)">ψ</text>
                </svg>
            </div>
            
            <div class="visualization">
                <div class="vis-title">【玫羲球】</div>
                <div id="threeCanvas"></div>
                <div style="color: #aaa; font-size: 12px; margin-top: 5px;">(提示：可使用滑鼠控制旋转和缩放)</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        // ========== Three.js 初始化 ==========
        const threeContainer = document.getElementById('threeCanvas');
        const scene = new THREE.Scene();
        
        // 摄影机与渲染器
        const camera = new THREE.PerspectiveCamera(45, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
        camera.position.set(2.5, 1.5, 3.5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        threeContainer.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 画球外壳
        const sphereGeometry = new THREE.SphereGeometry(1, 32, 16);
        const sphereMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x4da8da, wireframe: true, transparent: true, opacity: 0.15 
        });
        const blochSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(blochSphere);

        const edges = new THREE.EdgesGeometry(new THREE.SphereGeometry(1, 16, 8));
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x4da8da, transparent: true, opacity: 0.3 });
        scene.add(new THREE.LineSegments(edges, lineMaterial));

        // 画 XYZ 轴 (Three.js 中 Y 轴朝上对应物理空间的 Z 轴 / 北极)
        const createAxis = (color, endPt) => {
            const mat = new THREE.LineBasicMaterial({ color: color });
            const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), endPt]);
            return new THREE.Line(geo, mat);
        };
        scene.add(createAxis(0xaaaaaa, new THREE.Vector3(1.2, 0, 0))); // X
        scene.add(createAxis(0xaaaaaa, new THREE.Vector3(0, 0, 1.2))); // Y (物理空间)
        scene.add(createAxis(0xeeeeee, new THREE.Vector3(0, 1.2, 0))); // Z (物理空间/北极)

        const arrowOrigin = new THREE.Vector3(0, 0, 0);
        const arrowDir = new THREE.Vector3(0, 1, 0);
        const blochArrow = new THREE.ArrowHelper(arrowDir, arrowOrigin, 1.0, 0xffffff, 0.15, 0.1);
        scene.add(blochArrow);

        // ========== 原有 HTML 控制逻辑整合 ==========
        const R = 100; // 显示缩放基准
        let animationId;
        let isPlaying = false;
        let systemTime = 0; 

        const inputThetaOrig = document.getElementById('theta_orig');
        const inputEta = document.getElementById('eta');
        const inputThetaObs = document.getElementById('theta_obs');
        const toggleDecomp = document.getElementById('toggleDecomp');
        const decompGroup = document.getElementById('decompositionGroup');
        const decompLegend = document.getElementById('decompLegend');

        toggleDecomp.addEventListener('change', (e) => {
            if(e.target.checked) {
                decompGroup.setAttribute('display', 'inline');
                decompLegend.style.display = 'block';
            } else {
                decompGroup.setAttribute('display', 'none');
                decompLegend.style.display = 'none';
            }
            if(!isPlaying) renderVisualization();
        });

        // ==========================================
        // 公式計算區 (Wigner Rotation 等效)
        // ==========================================
        function updateFromEta() {
            let th_orig = parseFloat(inputThetaOrig.value) * Math.PI / 180;
            let eta = parseFloat(inputEta.value);
            
            let tan_orig = Math.tan(th_orig / 2);
            let tanh_eta = Math.tanh(eta / 2);
            
            let tan_obs = (tanh_eta + tan_orig) / (1 + tan_orig * tanh_eta);
            if(tan_obs < 0) tan_obs = 0; 
            
            inputThetaObs.value = (2 * Math.atan(tan_obs) * 180 / Math.PI).toFixed(2);
            renderVisualization();
        }

        function updateFromThetaObs() {
            let th_orig = parseFloat(inputThetaOrig.value) * Math.PI / 180;
            let th_obs = parseFloat(inputThetaObs.value) * Math.PI / 180;
            
            let tan_orig = Math.tan(th_orig / 2);
            let tan_obs = Math.tan(th_obs / 2);
            
            let tanh_eta = (tan_obs - tan_orig) / (1 - tan_obs * tan_orig);
            tanh_eta = Math.max(-0.999, Math.min(0.999, tanh_eta));
            
            let eta = 2 * Math.atanh(tanh_eta);
            inputEta.value = Math.max(-3, Math.min(3, eta)).toFixed(2);
            renderVisualization();
        }

        function updateFromThetaOrig() { updateFromEta(); }

        // --- 核心物理渲染 ---
        function renderVisualization() {
            const alpha = parseFloat(document.getElementById('alpha').value);
            const eta = parseFloat(inputEta.value);
            const th_orig = parseFloat(inputThetaOrig.value);
            const th_obs = parseFloat(inputThetaObs.value);
            const omega = parseFloat(document.getElementById('omega').value);
            
            // 1. 计算狄拉克表象初始态 (r_large, r_small)
            const radThetaOrig = th_orig * Math.PI / 180;
            const r_large_orig = Math.cos(radThetaOrig / 2);
            const r_small_orig = Math.sin(radThetaOrig / 2);

            // 2. 切换至外尔表象初始长短轴 (a_o, b_o)
            const a_orig = r_large_orig + r_small_orig;
            const b_orig = r_large_orig - r_small_orig;
            
            // 3. 洛伦兹推进矩阵作用后 η 
            const a_boost = a_orig * Math.exp(eta / 2);
            const b_boost = b_orig * Math.exp(-eta / 2);

            // 4. 计算绘图的实际尺度
            const a_axis = R * a_boost; 
            const b_axis = R * b_boost; 
            
            const draw_a = Math.max(Math.abs(a_axis), 0.1);
            const draw_b = Math.max(Math.abs(b_axis), 0.1);

            // 5. 洛伦兹推进后的大小园半径
            const r_large = (a_axis + b_axis) / 2;
            const r_small = (a_axis - b_axis) / 2;
            
            // 6. 相位与旋转设定 (依照自旋论文中的公式 α = 2(π/2 + φ_tilt))
            const tilt_deg = alpha / 2;
            const tilt_rad = tilt_deg * Math.PI / 180;
            const alpha_rad = alpha * Math.PI / 180;
            
            // 玫羲球方位角 φ_macy = -2ωt + α
            let phi_deg = alpha - 2 * systemTime;
            let color_phi = ((phi_deg % 360) + 360) % 360; // 确保 HSL 色环维持正数
            
            const t_rad = systemTime * Math.PI / 180;

            // 7. 向量叠加 (X=水平, Z=垂直)
            // 大园 (逆时针)
            const x_large = r_large * Math.sin(t_rad);
            const z_large = r_large * Math.cos(t_rad);
            
            // 小园 (顺时针，加初始相位 α)
            const x_small = r_small * Math.sin(-t_rad + alpha_rad);
            const z_small = r_small * Math.cos(-t_rad + alpha_rad);
            
            const x_total = x_large + x_small;
            const z_total = z_large + z_small;
            
            // 8. 映射到 SVG 坐标 (SVG 的 Y 轴朝下，故将 Z 反转)
            const svg_x = x_total;
            const svg_y = -z_total;
            const vectorColor = `hsl(${color_phi}, 100%, 55%)`;

            // SVG 大小园坐标
            const svg_x_large = x_large;
            const svg_y_large = -z_large;
            const svg_x_small = x_small;
            const svg_y_small = -z_small;

            // UI 数值更新
            document.getElementById('thetaOrigVal').innerText = th_orig.toFixed(1) + '°';
            document.getElementById('etaVal').innerText = eta.toFixed(2);
            document.getElementById('thetaObsVal').innerText = th_obs.toFixed(1) + '°';
            document.getElementById('omegaVal').innerText = omega.toFixed(1) + ' x';
            document.getElementById('alphaVal').innerText = alpha + '°';

            // SVG 椭圆与轨迹更新
            const ellipseElement = document.getElementById('boostedEllipse');
            ellipseElement.setAttribute('rx', draw_b); // 由于 Z 轴式运动方向，当无倾角时 rx 负责短轴 b
            ellipseElement.setAttribute('ry', draw_a); 
            document.getElementById('majorAxis').setAttribute('y1', -draw_a);
            document.getElementById('majorAxis').setAttribute('y2', draw_a);
            // 旋转使长短轴对应 tilt 角
            document.getElementById('ellipseGroup').setAttribute('transform', `rotate(${tilt_deg})`);

            document.getElementById('vectorLine').setAttribute('x2', svg_x);
            document.getElementById('vectorLine').setAttribute('y2', svg_y);
            document.getElementById('vectorLine').setAttribute('stroke', vectorColor);
            document.getElementById('vectorPoint').setAttribute('cx', svg_x);
            document.getElementById('vectorPoint').setAttribute('cy', svg_y);
            document.getElementById('vectorPoint').setAttribute('fill', vectorColor);
            document.getElementById('labelE').setAttribute('x', svg_x + 12);
            document.getElementById('labelE').setAttribute('y', svg_y - 12);
            document.getElementById('labelE').setAttribute('fill', vectorColor);

            if (toggleDecomp.checked) {
                document.getElementById('largeCirclePath').setAttribute('r', r_large);
                document.getElementById('smallCirclePath').setAttribute('r', r_small);
                document.getElementById('vecLarge').setAttribute('x2', svg_x_large);
                document.getElementById('vecLarge').setAttribute('y2', svg_y_large);
                document.getElementById('vecSmall').setAttribute('x2', svg_x_small);
                document.getElementById('vecSmall').setAttribute('y2', svg_y_small);
                document.getElementById('dotLarge').setAttribute('cx', svg_x_large);
                document.getElementById('dotLarge').setAttribute('cy', svg_y_large);
                document.getElementById('dotSmall').setAttribute('cx', svg_x_small);
                document.getElementById('dotSmall').setAttribute('cy', svg_y_small);
                
                const pathData = `M ${svg_x_large} ${svg_y_large} L ${svg_x} ${svg_y} L ${svg_x_small} ${svg_y_small}`;
                document.getElementById('parallelogram').setAttribute('d', pathData);
            }

            // === 玫羲球状态更新 ===
            const radThetaObs = th_obs * Math.PI / 180;
            const radPhi = phi_deg * Math.PI / 180;

            // 转换为 Three.js 坐标
            const bx = Math.sin(radThetaObs) * Math.cos(radPhi);
            const bz = Math.sin(radThetaObs) * Math.sin(radPhi);
            const by = Math.cos(radThetaObs);

            blochArrow.setDirection(new THREE.Vector3(bx, by, bz).normalize());
            blochArrow.setColor(new THREE.Color(`hsl(${color_phi}, 100%, 55%)`));

            renderer.render(scene, camera);

            // 资讯面板更新 (依据论文公式)
            const phi_tilt_deg = (alpha / 2) - 90;
            document.getElementById('infoPanel').innerHTML = `
                <div style="color: #f1c40f; margin-bottom: 5px; font-weight: bold;">[ 状态观察 ]</div>
                大小园初始相位差 α = <strong>${alpha.toFixed(1)}°</strong><br>
                倾角 φ_tilt = <strong>${phi_tilt_deg.toFixed(1)}°</strong><br>
                方位角 φ_macy = <strong>${phi_deg.toFixed(1)}°</strong><br>
                <i style="color:#aaa; font-size:12px;">(公式：φ_macy = -2ωt + α)</i><br><br>
                <div style="color: #e74c3c; margin-bottom: 3px; font-weight: bold;">[ 洛伦兹推进联动验证 ]</div>
                极角 θ_macy = <strong>${th_obs.toFixed(1)}°</strong><br>
                <i style="color:#aaa; font-size:12px;">(公式：θ_macy = 2 tan⁻¹((a-b)/(a+b)))</i>
            `;
        }

        // --- 动画回圈与事件绑定 ---
        function animate() {
            if (isPlaying) {
                systemTime += parseFloat(document.getElementById('omega').value);
                renderVisualization();
            }
            controls.update(); 
            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }
        
        animate();

        document.getElementById('playBtn').addEventListener('click', () => { isPlaying = true; });
        document.getElementById('pauseBtn').addEventListener('click', () => { isPlaying = false; });

        inputThetaOrig.addEventListener('input', () => { updateFromThetaOrig(); });
        inputEta.addEventListener('input', () => { updateFromEta(); });
        inputThetaObs.addEventListener('input', () => { updateFromThetaObs(); });
        
        document.getElementById('alpha').addEventListener('input', () => { if(!isPlaying) renderVisualization(); });
        document.getElementById('omega').addEventListener('input', () => { if(!isPlaying) renderVisualization(); });

        window.addEventListener('resize', () => {
            camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
            renderVisualization();
        });

        // 启动初始渲染
        updateFromEta();
    </script>
